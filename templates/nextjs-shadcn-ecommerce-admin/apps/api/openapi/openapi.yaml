components:
  schemas:
    CheckoutRequest:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          example: order-2026-000123
        payer:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              example: jane@example.com
            document:
              type: string
              example: "12345678"
            phone:
              example: +1 555 0100
              type: string
          required:
            - name
            - email
            - document
        items:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
              quantity:
                type: integer
                exclusiveMinimum: 0
                maximum: 9007199254740991
                example: 2
            required:
              - productId
              - quantity
      required:
        - orderId
        - items
      description: Creates a dLocal Go checkout session tied to a persisted order.
        Replaying the same orderId returns the existing session instead of
        creating a duplicate.
      example:
        orderId: order-2026-000123
        payer:
          name: Jane Doe
          email: jane@example.com
          document: "12345678"
        items:
          - productId: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
            quantity: 2
    DlocalNotification:
      type: object
      properties:
        payment_id:
          type: string
          example: D-4-e836ba0b-1f9b-4a3e
      required:
        - payment_id
      description: dLocal Go's payment-notification webhook payload.
    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Electronics
      required:
        - name
      description: Creates a category. `slug` is derived from `name`.
    CategoryUpdate:
      type: object
      properties:
        name:
          example: Electronics
          type: string
          minLength: 1
        isActive:
          example: true
          type: boolean
      description: Updates a category. Renaming re-derives `slug` from the new `name`.
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
        name:
          type: string
          example: Wireless Mouse
        slug:
          type: string
          example: wireless-mouse
        description:
          anyOf:
            - type: string
            - type: "null"
          example: Ergonomic wireless mouse.
        coverImage:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          example: https://images.example.com/wireless-mouse.jpg
        categoryId:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: "null"
          example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
        isActive:
          type: boolean
          example: true
        defaultPrice:
          anyOf:
            - type: number
            - type: "null"
          example: 29.99
        variantCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          example: 2
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          example: 2026-01-01T00:00:00Z
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          example: 2026-01-01T00:00:00Z
      required:
        - id
        - name
        - slug
        - description
        - coverImage
        - categoryId
        - isActive
        - defaultPrice
        - variantCount
        - createdAt
        - updatedAt
      description: A catalog product, with its derived default-variant price and
        variant count.
    ProductCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Wireless Mouse
        description:
          example: Ergonomic wireless mouse.
          type: string
        coverImage:
          example: https://images.example.com/wireless-mouse.jpg
          type: string
          format: uri
        categoryId:
          example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - name
      description: "Creates a product as a draft (`isActive: false`). `slug` is
        derived from `name`."
    ProductUpdate:
      type: object
      properties:
        name:
          example: Wireless Mouse
          type: string
          minLength: 1
        description:
          example: Ergonomic wireless mouse.
          anyOf:
            - type: string
            - type: "null"
        coverImage:
          example: https://images.example.com/wireless-mouse.jpg
          anyOf:
            - type: string
              format: uri
            - type: "null"
        categoryId:
          example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: "null"
        isActive:
          example: true
          type: boolean
      description: Updates a product. Renaming re-derives `slug` from the new `name`.
    StockUpdate:
      type: object
      properties:
        stock:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          example: 42
        stockMin:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          example: 5
      required:
        - stock
        - stockMin
      description: Sets a product's stock and low-stock threshold.
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
        orderId:
          type: string
          example: order-2026-000123
        mail:
          anyOf:
            - type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            - type: "null"
          example: jane@example.com
        buyerInfo:
          anyOf:
            - type: object
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  example: jane@example.com
                document:
                  type: string
                  example: "12345678"
                phone:
                  example: +1 555 0100
                  type: string
              required:
                - name
                - email
                - document
            - type: "null"
        dlocalId:
          anyOf:
            - type: string
            - type: "null"
          example: D-4-e836ba0b-1f9b-4a3e
        buyerProducts:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
              slug:
                type: string
                example: wireless-mouse
              quantity:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
                example: 2
              unitPrice:
                type: number
                example: 29.99
              lineTotal:
                type: number
                example: 59.98
            required:
              - productId
              - slug
              - quantity
              - unitPrice
              - lineTotal
        status:
          type: string
          example: PAID
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          example: 2026-01-01T00:00:00Z
        updatedAt:
