components:
  schemas:
    CheckoutRequest:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          example: order-2026-000123
        payer:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              example: jane@example.com
            document:
              type: string
              example: "12345678"
            phone:
              example: +1 555 0100
              type: string
          required:
            - name
            - email
            - document
        items:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                example: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
              quantity:
                type: integer
                exclusiveMinimum: 0
                maximum: 9007199254740991
                example: 2
            required:
              - productId
              - quantity
      required:
        - orderId
        - items
      description: Creates a dLocal Go checkout session tied to a persisted order.
        Replaying the same orderId returns the existing session instead of
        creating a duplicate.
      example:
        orderId: order-2026-000123
        payer:
          name: Jane Doe
          email: jane@example.com
          document: "12345678"
        items:
          - productId: 9c4f3e1a-3b7e-4b1a-9c7a-4d3b6e2f8a1c
            quantity: 2
    DlocalNotification:
      type: object
      properties:
        payment_id:
          type: string
          example: D-4-e836ba0b-1f9b-4a3e
      required:
        - payment_id
      description: dLocal Go's payment-notification webhook payload.
    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Electronics
      required:
        - name
      description: Creates a category. `slug` is derived from `name`.
    CategoryUpdate:
      type: object
      properties:
        name:
          example: Electronics
          type: string
          minLength: 1
        isActive:
          example: true
          type: boolean
