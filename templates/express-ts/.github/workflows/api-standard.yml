name: API Standard (schema-shape)

# Copied into every app scaffolded from this template (create-coliapp's
# `cpyTemplate` uses `fs.copySync` with no dotfile filter). Ordinary
# `pull_request` trigger — no `pull_request_target`, no dynamic `gh pr`
# composition, per the api-enforcement-mechanism design's Threat Matrix.
#
# This is Layer 2 (PR-time CI) of the 3-layer enforcement model documented in
# hefesto's `.claude/rules/api-enforcement.md`: loud (a visible ✗ on the PR),
# not a technical merge block — GitHub Free has no branch protection/rulesets
# on private repos. The real gate is deploy-time CI (Layer 3, `infra`'s
# `build-api.template.yml`, pending that team's acceptance).
#
# Schema-shape only (ADR 0009 + ADR 0011): Spectral (this template's own
# `.spectral.yaml`), oasdiff (additive-only diff), license-checker. The
# behavioral checklist (ADR 0010/0012/0013) and the attestation gate script
# (`api-standard-gate.mjs`, `api-standard/findings.json`) are Phase 3 of the
# same SDD change, wired into this same file in a later PR.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-standard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-shape:
    name: Spectral, oasdiff, license-checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI spec (ADR 0009 shape rules)
        run: pnpm run api-standard:lint

      - name: License compliance (ADR 0011 — no GPL/LGPL/AGPL/SSPL)
        run: pnpm run api-standard:license

      # oasdiff needs two FILE paths, not git refs — extract the base
      # branch's copy of the spec first. Skips cleanly (no diff step) when
      # the base ref has no such file yet (e.g. this PR introduces it).
      # Written INSIDE the workspace (an ephemeral, never-committed
      # dotfile), not the runner's `/tmp` — oasdiff's docker action only
      # mounts GITHUB_WORKSPACE.
      - name: Extract base OpenAPI spec
        id: base-spec
        run: |
          if git show "origin/${{ github.event.pull_request.base.ref }}:openapi/openapi.yaml" > "${{ github.workspace }}/.oasdiff-base-openapi.yaml" 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for breaking OpenAPI changes (additive-only, ADR 0009)
        if: steps.base-spec.outputs.found == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.13
        with:
          base: .oasdiff-base-openapi.yaml
          revision: openapi/openapi.yaml
          fail-on: ERR
