name: Frontend Standard

# Copied into every app scaffolded from this template (create-coliapp's
# `cpyTemplate` uses `fs.copySync` with no dotfile filter) — the first
# frontend template in `create-coliapp` to ship its own CI, per hefesto's
# ADR 0026 Decision A (`.claude/rules/frontend-template-baseline.md`):
# "every future frontend template ships a CI job covering lint/format,
# typecheck, unit tests, plus any template-appropriate additional gates."
#
# Phase 1 (template skeleton) covered lint/format + typecheck + build only.
# Phase 2 (auth/tenant layer) adds Vitest's pure-logic unit tests. Component
# tests (Storybook's Vitest addon), E2E (Playwright), and a Lighthouse CI
# budget land in a later phase of the `kumo-console-template` SDD change —
# add jobs/steps below without restructuring this file.
#
# Ordinary `pull_request` trigger only — no `pull_request_target`, no
# dynamic `gh pr` composition, same Threat Matrix posture as
# `express-ts`'s own `api-standard.yml`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-standard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, format, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: pnpm exec biome check .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm run build
