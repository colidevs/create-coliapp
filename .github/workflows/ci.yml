name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (root package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  template-express-ts:
    name: templates/express-ts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/express-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: templates/express-ts/pnpm-lock.yaml

      # Arc A7 (colidevs/hefesto's e2e-buildable-toolset-plan.md) added
      # @colidevs/api-kit as this template's first-ever @colidevs/* dependency
      # — same reason templates/nextjs-kumo-console's own job already has this
      # step (see below): pnpm pack/publish unconditionally strips a file
      # literally named .npmrc, so the real registry scoping ships as
      # .npmrc.template and must be restored before install, same as a real
      # scaffold's own restoreNpmrcFiles does. Missing this step 404s against
      # the public registry (verified live, 2026-08-29 — the first PR to add
      # this dependency failed CI exactly this way).
      - name: Restore .npmrc
        run: cp .npmrc.template .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm exec biome check .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  template-nextjs-kumo-console:
    name: templates/nextjs-kumo-console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/nextjs-kumo-console
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: templates/nextjs-kumo-console/pnpm-lock.yaml

      # This template ships its own registry config as .npmrc.template, not
      # .npmrc (pnpm pack/publish unconditionally strip any file literally
      # named .npmrc — see index.ts's restoreNpmrcFiles). A real scaffold
      # restores it automatically; this CI job tests the template's source
      # tree directly, bypassing that scaffold step, so it must restore the
      # same file itself before installing — otherwise pnpm has no scoped
      # registry mapping for @colidevs/* and 404s against the public registry.
      - name: Restore .npmrc
        run: cp .npmrc.template .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm exec biome check .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  api-standard:
    name: templates/express-ts (API standard, schema-shape)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: templates/express-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: templates/express-ts/pnpm-lock.yaml

      # See the identical step's comment in the templates/express-ts job above.
      - name: Restore .npmrc
        run: cp .npmrc.template .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI spec (ADR 0009 shape rules)
        run: pnpm run api-standard:lint

      - name: License compliance (ADR 0011 — no GPL/LGPL/AGPL/SSPL)
        run: pnpm run api-standard:license

      # Same two-file oasdiff pattern as the copied
      # `templates/express-ts/.github/workflows/api-standard.yml` — dogfoods
      # this repo's own seed spec so drift is caught here too, not only in
      # scaffolded consumer apps.
      # oasdiff's docker action only mounts GITHUB_WORKSPACE, not the
      # runner's `/tmp` — the extracted base spec is written INSIDE the
      # workspace (an ephemeral, never-committed dotfile) so the action can
      # actually read it, then referenced by a workspace-relative path
      # (`uses:` steps ignore `defaults.run.working-directory`).
      - name: Extract base OpenAPI spec
        id: base-spec
        run: |
          if git show "origin/${{ github.event.pull_request.base.ref || 'main' }}:templates/express-ts/openapi/openapi.yaml" > "${{ github.workspace }}/.oasdiff-base-openapi.yaml" 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for breaking OpenAPI changes (additive-only, ADR 0009)
        if: steps.base-spec.outputs.found == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.13
        with:
          base: .oasdiff-base-openapi.yaml
          revision: templates/express-ts/openapi/openapi.yaml
          fail-on: ERR

      # Same attestation gate as the copied
      # `templates/express-ts/.github/workflows/api-standard.yml` — dogfoods
      # it against this repo's own copy of the template. Static invocation,
      # no PR-event data interpolated into the command (Threat Matrix: PR
      # commands).
      - name: Attestation gate (ADR 0009-0013 findings)
        run: node scripts/api-standard-gate.mjs

# NOTE (2026-08-19): `templates/express-ts` (backend, ADR 0014) and
# `templates/nextjs-kumo-console` (frontend, ADR 0026 Decision A, Phase 1 of
# the `kumo-console-template` SDD change) are the only templates with their
# own lint/typecheck/test CI job today. The other scaffolded templates
# (nextjs-eslint-ts-shadcn, nextjs-eslint-ts-shadcn-sheet, nextjs15-biome-shadcn,
# react-vite-js-tailwind) have no equivalent CI job yet — tracked as a
# separate, not-yet-scoped follow-up rather than silently expanded here.
