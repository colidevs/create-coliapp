# TEMPLATE PLACEHOLDER — replace with the real Apidog-exported spec (ADR
# 0005 / `.claude/rules/api-design-apidog.md`: design the contract in Apidog
# BEFORE implementation, this file is not where new endpoints should be
# hand-authored going forward). Scaffolded here only so
# `express-openapi-validator` (task 3.6) has a real, valid spec to validate
# against out of the box, covering exactly this template's one existing
# endpoint (`/api/v1/healthcheck/status`).
openapi: 3.1.0
info:
  title: "{{name}}"
  version: "1.0.0"
  description: >-
    Minimal starter spec for this template's existing endpoints. Replace
    wholesale with the real Apidog-exported OpenAPI document once the
    project's actual API contract is designed there.
servers:
  - url: /api/v1
paths:
  /healthcheck/status:
    get:
      operationId: getHealthcheckStatus
      summary: Application-level healthcheck status
      security: []
      responses:
        "200":
          description: Healthcheck status message
          content:
            application/json:
              schema:
                type: object
                required:
                  - msg
                properties:
                  msg:
                    type: string
                    example: "V1 Healthcheck Status OK ✅"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /me:
    get:
      operationId: getMe
      summary: Current authenticated caller
      description: >-
        Returns the caller's own identity, resolved from the Better Auth
        session (`src/lib/auth.ts` / `src/v1/middlewares/auth.ts`). The one
        route this template gates with real auth, replacing the previous
        HTTP Basic Auth placeholder.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The authenticated caller's identity
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                properties:
                  id:
                    type: string
                    example: "usr_01hz8p7q9k2m3n4p5q6r7s8t9u"
                  email:
                    type: string
                    format: email
                    example: "jane@example.com"
        "401":
          description: Missing or invalid session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    # Session cookie (ADR 0022 / frontend-security-auth.md: httpOnly cookies
    # are the default token-storage mechanism for the same-root-domain
    # topology this template assumes — Arc A4 of hefesto's
    # e2e-buildable-toolset-plan.md). The actually-implemented middleware
    # (`src/v1/middlewares/auth.ts`) reads Better Auth's own session cookie
    # via `fromNodeHeaders`/`getAuth().api.getSession` — never an
    # `Authorization: Bearer` header, which `express-openapi-validator`
    # would otherwise demand and reject every real cookie-authenticated
    # request with, before Better Auth's own check ever runs (found live,
    # Arc A6 smoke test, 2026-08-29 — every `/me` call 401'd on the
    # validator layer itself). `bearerAuth` remains available below for a
    # future cross-root-domain deployment (ADR 0036's escape hatch) that
    # genuinely needs Better Auth's `bearer` plugin instead.
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    # OAuth2 Bearer (ADR 0009 / api-communication-standard.md), for a
    # cross-root-domain deployment using ADR 0036's escape hatch — not the
    # default `/me` scheme (see `sessionCookie` above), kept available for
    # a route/deployment that genuinely needs it.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # RFC 9457 Problem Details (ADR 0009 / api-communication-standard.md).
    # Mirrors `src/v1/res/errors.ts`'s `ProblemDetails` interface.
    Problem:
      type: object
      required:
        - type
        - status
        - title
      properties:
        type:
          type: string
          format: uri-reference
          example: "https://coli.dev/errors/not-found"
        status:
          type: integer
          example: 404
        title:
          type: string
          example: "Resource not found."
        detail:
          type: string
          example: "Resource not found. order 1"
        instance:
          type: string
          example: "/api/v1/orders/1"
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: must be a valid email
